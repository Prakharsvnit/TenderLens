[project]
name = "tenderlens"
version = "0.1.0"
description = "RFP response and compliance agents on AWS"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "pdfplumber>=0.11",
    "boto3>=1.35",
    "langchain>=1.0",
    "langchain-aws>=1.0",
    "langgraph>=1.0",
    "aws-lambda-powertools[tracer]>=3.0",
    "openpyxl>=3.1",
    "python-docx>=1.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tenderlens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP047"]
